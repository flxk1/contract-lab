width:700px){.message.summary{font-size:11px;padding:8px}}</style></head><body><noscript><p style="margin:16px;padding:12px 16px;border:1px solid #c00;color:#c00;font:15px/1.5 system-ui">JavaScript is turned off in this browser, so the buttons cannot work. Turn JavaScript on in the browser's settings and reload this page.</p></noscript><main aria-label="Agent workspace"><section class="chat" aria-label="Buyer agent"><div class="name" id="buyerName">Buyer</div><div id="buyerFeed" class="feed" role="log" aria-label="Buyer conversation"></div><section class="skills" aria-label="Private buyer skill"><button class="skill-toggle" id="buyerToggle" aria-controls="buyerEditor" aria-expanded="true">Skill</button><div id="buyerEditor" class="editor"><details class="skill-panel" id="buyerRolePanel"><summary>Role &amp; goal</summary><textarea id="buyerRole" class="role-editor" spellcheck="false" aria-label="Private role and goal"></textarea></details><details class="skill-panel" id="buyerGuardrailsPanel"><summary>Guardrails <span id="buyerGuardStatus">· on</span></summary><label class="guardrail-switch"><input type="checkbox" id="buyerGuardsEnabled" checked> Apply guardrails</label><textarea id="buyerGuardrails" class="guard-editor" spellcheck="false" aria-label="Private guardrails"></textarea></details><details class="skill-panel" id="buyerBehaviorPanel"><summary>Skill &amp; economics</summary><textarea id="buyerSkill" spellcheck="false" aria-label="Private skill and economics" aria-describedby="buyerError"></textarea></details><div id="buyerError" class="error" role="alert"></div><details class="rule-trace"><summary>Rule trace</summary><pre id="buyerTrace"></pre></details></div></section></section><section class="chat" aria-label="Seller agent"><div class="name" id="sellerName">Seller</div><div id="sellerFeed" class="feed" role="log" aria-label="Seller conversation"></div><section class="skills" aria-label="Private seller skill"><button class="skill-toggle" id="sellerToggle" aria-controls="sellerEditor" aria-expanded="true">Skill</button><div id="sellerEditor" class="editor"><details class="skill-panel" id="sellerRolePanel"><summary>Role &amp; goal</summary><textarea id="sellerRole" class="role-editor" spellcheck="false" aria-label="Private role and goal"></textarea></details><details class="skill-panel" id="sellerGuardrailsPanel"><summary>Guardrails <span id="sellerGuardStatus">· on</span></summary><label class="guardrail-switch"><input type="checkbox" id="sellerGuardsEnabled" checked> Apply guardrails</label><textarea id="sellerGuardrails" class="guard-editor" spellcheck="false" aria-label="Private guardrails"></textarea></details><details class="skill-panel" id="sellerBehaviorPanel"><summary>Skill &amp; economics</summary><textarea id="sellerSkill" spellcheck="false" aria-label="Private skill and economics" aria-describedby="sellerError"></textarea></details><div id="sellerError" class="error" role="alert"></div><details class="rule-trace"><summary>Rule trace</summary><pre id="sellerTrace"></pre></details></div></section></section><div class="run-controls" aria-label="Simulation controls"><button id="start" type="button">Start</button><button id="step" type="button">Step</button><button id="pause" type="button" disabled>Pause</button><button id="stop" type="button" disabled>Stop</button><button id="reset" type="button">Reset</button></div></main><script id="engine">const copy=value=>JSON.parse(JSON.stringify(value));
const own=(object,key)=>Object.prototype.hasOwnProperty.call(object,key);
const money=cents=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(cents/100);
class SkillError extends Error{}
function expression(source,context,depth=0){
 if(source.length>2048)throw new SkillError('Expression exceeds the 2048-character limit.');
 if(depth>20)throw new SkillError("Cyclic or excessively nested private expression.");
 const tokens=[];let cursor=0;const pattern=/\s*(?:(\d+(?:\.\d+)?)|([A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([()+\-*/,]))/y;
 while(cursor<source.length){pattern.lastIndex=cursor;const m=pattern.exec(source);if(!m)throw new SkillError('Cannot read expression: '+source);tokens.push(m[1]!==undefined?{kind:'number',value:Number(m[1])}:m[2]?{kind:'name',value:m[2]}:m[3]?{kind:'string',value:m[3][0]==='"'?JSON.parse(m[3]):m[3].slice(1,-1)}:{kind:m[4],value:m[4]});cursor=pattern.lastIndex;}
 if(tokens.length>512)throw new SkillError('Expression exceeds the 512-token limit.');
 let index=0;const take=kind=>tokens[index]?.kind===kind?tokens[index++]:null;
 function number(value){if(typeof value!=='number'||!Number.isFinite(value))throw new SkillError('A numeric rule used a missing or non-numeric value.');return value;}
 function atom(){if(take('-'))return -number(atom());if(take('+'))return number(atom());if(take('(')){const value=add();if(!take(')'))throw new SkillError('Missing closing parenthesis.');return value;}const token=tokens[index++];if(!token)throw new SkillError('Incomplete expression.');if(token.kind==='number'||token.kind==='string')return token.value;if(token.kind!=='name')throw new SkillError('Unexpected expression token.');const name=token.value;if(take('(')){if(!['min','max','abs','round','optional','min_set','max_set','pow','quality_value','prospect'].includes(name))throw new SkillError('Unsupported function: '+name);const args=[];if(!take(')')){do{args.push(add());}while(take(','));if(!take(')'))throw new SkillError('Missing closing parenthesis.');}if(!args.length)throw new SkillError('Function needs an argument.');if(name==='quality_value'){if(args.length!==4)throw new SkillError('quality_value needs quality and basic/standard/premium values.');const quality=args[0];if(quality===null||quality==='none')return 0;if(!['basic','standard','premium'].includes(quality))throw new SkillError('Quality must be basic, standard or premium.');args.slice(1).forEach(number);return args[['basic','standard','premium'].indexOf(quality)+1];}if(name==='optional'){if(args.length!==1||typeof args[0]!=='string'||!/^([A-Za-z_]\w*)$/.test(args[0])||['message','state','turn','event','own_price','memory','round','deal','outcome','constructor','prototype','__proto__'].includes(args[0]))throw new SkillError('optional needs one quoted private field name.');return own(context,args[0])?expression(args[0],context,depth+1):null;}if(name==='min_set'||name==='max_set'){const values=args.filter(v=>v!==null).map(number);return values.length?Math[name==='min_set'?'min':'max'](...values):null;}args.forEach(number);if(name==='pow'){if(args.length!==2)throw new SkillError('pow needs two numbers.');return Math.pow(...args);}if(name==='prospect'){if(args.length!==4||args[1]<=0||args[2]<=0||args[3]<=0)throw new SkillError('prospect needs gain, positive gain/loss exponents and a positive loss weight.');return args[0]>=0?Math.pow(args[0],args[1]):-args[3]*Math.pow(-args[0],args[2]);}if((name==='abs'||name==='round')&&args.length!==1)throw new SkillError(name+' needs one argument.');return Math[name](...args);}if(name==='true')return true;if(name==='false')return false;if(['none','null'].includes(name))return null;let value=context;for(const part of name.split('.')){if(['__proto__','constructor','prototype'].includes(part)||value==null||!own(Object(value),part))throw new SkillError('Unknown value: '+name);value=value[part];}return typeof value==='string'&&value.startsWith('$')&&!name.includes('.')&&!['message','event','own_price','turn','state','memory','round','deal','outcome'].includes(name)?expression(value.slice(1),context,depth+1):value;}
 function multiply(){let value=atom();while(tokens[index]&&['*','/'].includes(tokens[index].kind)){const op=tokens[index++].kind,right=number(atom());if(op==='/'&&right===0)throw new SkillError('Division by zero.');value=op==='*'?number(value)*right:number(value)/right;}return value;}
 function add(){let value=multiply();while(tokens[index]&&['+','-'].includes(tokens[index].kind)){const op=tokens[index++].kind,right=number(multiply());value=op==='+'?number(value)+right:number(value)-right;}return value;}
 const result=add();if(index!==tokens.length)throw new SkillError('Extra text in expression: '+source);if(typeof result==='number'&&!Number.isFinite(result))throw new SkillError('Non-finite numeric result.');return result;
}
function splitOutside(text,delimiter){const parts=[];let quote=null,depth=0,start=0;for(let i=0;i<text.length;i++){const ch=text[i];if(quote){if(ch==='\\')i++;else if(ch===quote)quote=null;continue;}if(ch==='"'||ch==="'"){quote=ch;continue;}if('({['.includes(ch))depth++;if(')}]'.includes(ch))depth--;if(depth===0&&text.startsWith(delimiter,i)){parts.push(text.slice(start,i).trim());i+=delimiter.length-1;start=i+1;}}parts.push(text.slice(start).trim());return parts;}
function parsePayload(text){return JSON.parse(text,(key,value)=>{if(typeof value==='number'&&!Number.isFinite(value))throw new SkillError('Message numbers must be finite.');return value;});}
function parseConstant(text){if(!text)throw new SkillError('A field value is missing.');if(text[0]==='"')return JSON.parse(text);if(/^(true|false)$/i.test(text))return text.toLowerCase()==='true';if(/^(none|null)$/i.test(text))return null;if(/^-?\d+(?:\.\d+)?$/.test(text)){const number=Number(text);if(!Number.isFinite(number))throw new SkillError('Numeric fields must be finite.');return number;}return text;}
const GUARD_FIELDS=new Set(['fallback','batna','limit','can_accept','can_offer','min_quality','max_delivery','required_payment','max_turns','stock']);
function validateTradeData(data){
 for(const key of ['quantity','delivery_days'])if(own(data,key)&&(key==='quantity'||data[key]!==null)){const v=data[key];if(typeof v!=='number'||!Number.isFinite(v)||(key==='quantity'?v<=0:v<0))throw new SkillError(key==='quantity'?'Quantity must be a positive finite number.':'Delivery days must be a non-negative finite number.');}
 if(own(data,'item')&&data.item!==null&&(typeof data.item!=='string'||!data.item.trim()))throw new SkillError('Item must be a non-empty description.');
 if(own(data,'quality')&&data.quality!==null&&!['basic','standard','premium'].includes(data.quality))throw new SkillError('Quality must be basic, standard or premium.');
}
function validatePrivateInputs(skill){
 const commercial=action=>action.kind==='sequence'?action.actions.some(commercial):['deliver','pay','accept','confirm'].includes(action.kind)||action.kind==='send'&&['request','counter','offer'].includes(action.type);if(!skill.rules.some(rule=>commercial(rule.action)))return;
 const nonnegative=new Set(['delivery_days','max_delivery','stock','opening','fallback','batna','cost_basic','cost_standard','cost_premium','production_cost','prior_good','prior_bad']);
 for(const [key,raw]of Object.entries(skill.vars)){if(!nonnegative.has(key)&&!['quantity','can_offer','can_accept','min_quality','quality','actual_quality','required_payment'].includes(key))continue;let v=raw;if(typeof raw==='string'&&raw.startsWith('$')){try{v=expression(raw.slice(1),skill.vars);}catch(error){if(/Unknown value: (message|state|own_price|turn|memory|round|deal|outcome)(\.|$)/.test(error.message))continue;throw error;}}if(v===null&&key!=='quantity')continue;let problem=null;if(['min_quality','quality','actual_quality'].includes(key)){if(!['basic','standard','premium'].includes(v))problem=key+' must be basic, standard or premium.';}else if(key==='required_payment'){if(typeof v!=='string'||!v.trim())problem='required_payment must be a non-empty payment condition.';}else if(['can_offer','can_accept'].includes(key)){if(typeof v!=='boolean')problem=key+' must be true, false or none.';}else if(typeof v!=='number'||!Number.isFinite(v)||(key==='quantity'?v<=0:v<0))problem=key+' must be '+(key==='quantity'?'positive':'non-negative')+' and finite.';if(problem){const line=skill.source.split('\n').findIndex(raw=>new RegExp('^\\s*'+key+'\\s*:').test(raw))+1;const issue=new SkillError('Line '+line+': '+problem);issue.line=line;throw issue;}}
 if(own(skill.vars,'prior_good')&&own(skill.vars,'prior_bad')&&skill.vars.prior_good===0&&skill.vars.prior_bad===0)throw new SkillError('prior_good and prior_bad cannot both be zero.');
}
function enforceGuardrails(skill,action,terms,agent){
 const keys=new Set(skill.guardrails||[]),context={...copy(skill.vars),message:copy(terms),state:copy(agent.state),memory:copy(agent.memory||{}),turn:agent.turn,round:agent.round||1,deal:copy(agent.deal||null),outcome:copy(agent.outcome||null),own_price:agent.state.lastSent?.price??skill.vars.opening??null};
 const value=key=>keys.has(key)?expression(key,context):null;const fail=text=>{throw new SkillError('Guardrail blocked '+action+': '+text);};
 if(value(action==='offer'?'can_offer':'can_accept')===false)fail('authority is disabled.');const limit=value('limit');if(limit!==null){if(typeof limit!=='number'||!Number.isFinite(limit)||limit<0)fail('price limit must be non-negative and finite.');if(action==='offer'&&terms.price<limit)fail('price is below the private floor.');if(action==='acceptance'&&terms.price>limit)fail('price exceeds the private ceiling.');}
 if(action==='offer'){const stock=value('stock');if(stock!==null&&terms.quantity!=null&&terms.quantity>stock)fail('insufficient stock.');}
 if(action==='acceptance'){const quality=value('min_quality'),days=value('max_delivery'),payment=value('required_payment');if(quality!==null&&(!['basic','standard','premium'].includes(terms.quality)||['basic','standard','premium'].indexOf(terms.quality)<['basic','standard','premium'].indexOf(quality)))fail('required quality is not met.');if(days!==null&&(typeof terms.delivery_days!=='number'||terms.delivery_days>days))fail('required delivery time is not met.');if(payment!==null&&terms.payment!==payment)fail('required payment terms are not met.');}
}
function compileSkill(source){if(source.length>65536)throw new SkillError('Skill exceeds the 65536-character limit.');const vars={},rules=[],guardrails=[];let guardMode=null;const reserved=new Set(['message','event','own_price','turn','state','memory','round','deal','outcome','__proto__','constructor','prototype']);for(const [i,raw]of source.split('\n').entries()){const line=raw.trim();if(/^#\s*Guardrails\s*$/i.test(line)){guardMode=true;continue;}if(/^#\s*(Skill|Role)/i.test(line)){guardMode=false;continue;}if(!line||line.startsWith('#'))continue;try{if(/^when\s/i.test(line)){const m=line.match(/^when\s+([A-Za-z_]\w*)(?:\s+if\s+(.+?))?\s*->\s*(.+)$/i);if(!m)throw new SkillError('Use: when event [if condition] -> action');const action=parseAction(m[3]);rules.push({event:m[1].toLowerCase(),condition:m[2]||'',action,line:i+1,source:line});}else{const m=line.match(/^([A-Za-z_]\w*)\s*:\s*(.*)$/);if(!m)throw new SkillError('Use a key: value field or a when event -> action rule.');const key=m[1].toLowerCase();if(reserved.has(key))throw new SkillError('Reserved field name: '+key);if(own(vars,key))throw new SkillError('Duplicate field: '+key);vars[key]=parseConstant(m[2].trim());if(guardMode===true||guardMode===null&&GUARD_FIELDS.has(key))guardrails.push(key);}}catch(error){throw new SkillError('Line '+(i+1)+': '+error.message);}}
 if(!Object.keys(vars).length&&!rules.length)throw new SkillError('The skill is empty.');if(!rules.length)throw new SkillError('Add a behaviour rule, for example: when request -> reply "How can I help?"');const skill={vars,rules,source,guardrails};for(const [key,value]of Object.entries(vars)){if(typeof value!=='string'||!value.startsWith('$'))continue;try{expression(value.slice(1),vars);}catch(error){if(/Unknown value: (message|state|own_price|turn|memory|round|deal|outcome)(\.|$)/.test(error.message))continue;const line=source.split('\n').findIndex(raw=>new RegExp('^\\s*'+key+'\\s*:').test(raw))+1;const issue=new SkillError('Line '+line+': cannot calculate '+key+': '+error.message);issue.line=line;throw issue;}}validatePrivateInputs(skill);validateStaticOffers(skill);return skill;}
function validateStaticOffers(skill){
 function check(action,rule){if(action.kind==='sequence'){for(const child of action.actions)check(child,rule);return;}if(action.kind!=='send'||action.type!=='offer')return;
 const raw=action.payload.price;let value=raw;
 if(typeof raw==='string'&&raw.startsWith('$')){try{value=expression(raw.slice(1),skill.vars);}catch(error){if(/Unknown value: (message|state|own_price|turn|memory|round|deal|outcome)(\.|$)/.test(error.message))return;const issue=new SkillError('Line '+rule.line+': this offer rule cannot calculate a price: '+error.message+' Set numeric price inputs, or replace the offer rule with a reply rule.');issue.line=rule.line;throw issue;}}
 if(typeof value!=='number'||!Number.isFinite(value)||value<0){const reference=typeof raw==='string'&&/^\$[A-Za-z_]\w*$/.test(raw)?raw.slice(1):'price';const detail=reference==='price'?'the price is missing or is not a non-negative number':reference+' is '+(value==null?'none':JSON.stringify(value));const issue=new SkillError('Line '+rule.line+': this rule sends an offer, but '+detail+'. Set a numeric price, or replace this offer rule with a reply rule.');issue.line=rule.line;throw issue;}}
 const covered=new Set();for(const rule of skill.rules){if(covered.has('any')||covered.has(rule.event))continue;let definite=!rule.condition;if(rule.condition&&!/\b(message|state|own_price|turn|memory|round|deal|outcome)\b/.test(rule.condition)){const comparisons=splitOutside(rule.condition,' or ').flatMap(group=>splitOutside(group,' and '));if(comparisons.every(part=>/^\s*\$/.test(part)||/^\s*optional\(/.test(part))){try{definite=conditionMatches(rule.condition,{...skill.vars,message:{}});}catch(_){definite=false;}}}if(definite){check(rule.action,rule);covered.add(rule.event);}}
}

 }
 stop(status='stopped'){if(this.done)return;this.done=true;this.reason=status==='edited'?'Stopped for a skill edit.':'Stopped by the user.';this.writeSummary(status);}
 completeEncounter(){if(this.round<this.encounters){this.begin();return;}this.done=true;this.reason=this.engine.reason;if(this.enabled){const count=(n,word)=>n+' '+word+(n===1?'':'s');this.event('platform','Session complete: '+count(this.round,'encounter')+'; '+count(this.contracts.length,'agreement')+'; '+count(this.results.filter(r=>r.delivered).length,'delivery').replace('deliverys','deliveries')+'; '+count(this.results.filter(r=>r.full_payment).length,'full payment')+'. No further encounters are scheduled. A student summary follows.','system',{status:'complete'});}this.writeSummary('complete');}

 next(){if(this.done)return;this.steps++;if(this.steps>2400){this.done=true;this.reason='Session limit reached.';this.event('platform',this.reason,'system');this.writeSummary('limit');return;}try{this.engine.next();this.sync();if(this.engine.error){this.error=this.engine.error;this.done=true;this.reason=this.engine.reason;this.writeSummary('error');return;}if(!this.engine.done)return;if(/40 actions/.test(this.engine.reason)){this.done=true;this.reason=this.engine.reason;this.writeSummary('limit');return;}
   if(this.phase==='negotiation'){this.contracts.push(...copy(this.engine.contracts));if(this.enabled&&this.engine.contracts.length){if(this.engine.contracts.length!==1)throw new SkillError('Repeated encounters support one agreement per encounter.');const deal=this.engine.contracts[0];this.engine.activeContract=copy(deal);for(const id of ['buyer','seller'])this.engine.agents[id].deal=copy(deal);this.resume('performance',[deal.offeredBy,deal.acceptedBy].map(to=>({to,type:'performance',message:{contract_id:deal.id,terms:copy(deal.terms)}})));return;}for(const id of ['buyer','seller'])this.memories[id].encounters++;this.completeEncounter();return;}
   if(this.phase==='performance'){this.observe();return;}this.completeEncounter();

function splitSkillSections(source){
 const parts={role:[],guards:[],skill:[]};let section='auto';
 for(const line of source.split('\n')){if(/^\s*#\s*Guardrails\s*$/i.test(line)){section='guards';continue;}if(/^\s*#\s*Skill\s*&?\s*economics\s*$/i.test(line)){section='skill';continue;}
  if(/^\s*(description|role|goal)\s*:/.test(line)){parts.role.push(line);continue;}
  const conventional=/^\s*(fallback|batna|limit|can_accept|can_offer|min_quality|max_delivery|required_payment|max_turns|stock)\s*:/.test(line);
  parts[section==='guards'?'guards':section==='auto'&&conventional?'guards':'skill'].push(line);
 }return Object.fromEntries(Object.entries(parts).map(([key,lines])=>[key,lines.join('\n').trim()]));
}
function loadSkillSections(slot,source){const p=splitSkillSections(source);$(slot+'Role').value=p.role;$(slot+'Guardrails').value=p.guards;$(slot+'Skill').value=p.skill;$(slot+'GuardsEnabled').checked=true;$(slot+'GuardStatus').textContent='· on';}
function composeSkill(slot){const enabled=$(slot+'GuardsEnabled').checked;$(slot+'GuardStatus').textContent=enabled?'· on':'· off';return $(slot+'Role').value+'\n\n# Guardrails\n'+(enabled?$(slot+'Guardrails').value:'')+'\n\n# Skill & economics\n'+$(slot+'Skill').value;}

const parseSkill=source=>compileSkill(source);

function halt(){if(runner)clearInterval(runner);runner=null;paused=false;updateControls();}

function tick(){simulation.next();if(simulation.error)$(simulation.error.agent+'Error').textContent=simulation.error.message;if(simulation.done)halt();render();}

function ensureSession(){if(!applyEdits()){revealSkillError();return false;}if(!simulation||simulation.done||stopped){try{simulation=new EconomicSession(configured);simulation.guardrailsState={buyer:$('buyerGuardsEnabled').checked,seller:$('sellerGuardsEnabled').checked};}catch(error){const slot=error.agent||'buyer';$(slot+'Error').textContent=error.message;$(slot+'Error').dataset.line=String(error.line||1);revealSkillError();return false;}}stopped=false;return true;}

for(const slot of ['buyer','seller']){

 for(const suffix of ['Role','Guardrails','Skill']){const editor=$(slot+suffix);editor.addEventListener('input',()=>{
  // Pasting a complete example into the skill editor imports its three sections.
  if(suffix==='Skill'&&/^\s*(?:(description|role|goal)\s*:|#\s*Guardrails\s*$)/m.test(editor.value))loadSkillSections(slot,editor.value);
  changed();
 });editor.addEventListener('blur',()=>{if(dirty.buyer||dirty.seller)applyEdits();});editor.addEventListener('keydown',event=>{if(event.key==='Enter'&&(event.ctrlKey||event.metaKey)){event.preventDefault();applyEdits();}});}
 $(slot+'GuardsEnabled').addEventListener('change',()=>{changed();applyEdits();});
}
$('start').onclick=start;$('step').onclick=step;$('pause').onclick=()=>{if(runner){halt();paused=true;updateControls();}else if(paused)start();};$('stop').onclick=()=>{stopped=true;halt();if(simulation&&!simulation.done)simulation.stop();render();updateControls();};$('reset').onclick=()=>{halt();if(editTimer)clearTimeout(editTimer);editTimer=null;simulation=null;stopped=false;render();updateControls();};updateControls();render();
